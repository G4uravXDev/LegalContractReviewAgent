<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Left Shield Facet Gradient -->
    <linearGradient id="lexFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Right Shield Facet Gradient -->
    <linearGradient id="lexFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Balance Beam Gradient -->
    <linearGradient id="lexBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- AI Apex Spark Gradient -->
    <linearGradient id="lexSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="lexShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#lexBg)" filter="url(#lexShadow)" />
  <rect x="4.5" y="4.5" width="91" height="91" rx="23.5" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1" fill="none" />

  <!-- Shield Wings (Guardian Silhouette) -->
  <path d="M 48 22 C 34 22, 22 30, 22 46 C 22 65, 41 78, 48 82 V 22 Z" fill="url(#lexFacetLeft)" opacity="0.88" />
  <path d="M 52 22 C 66 22, 78 30, 78 46 C 78 65, 59 78, 52 82 V 22 Z" fill="url(#lexFacetRight)" opacity="0.88" />

  <!-- Central Pillar Stem -->
  <path d="M 50 26 V 73" stroke="rgba(255, 255, 255, 0.75)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Horizontal Balance Beam -->
  <path d="M 28 42 H 72" stroke="url(#lexBeam)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Scale Suspension Cables -->
  <path d="M 34 42 L 29 55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 34 42 L 39 55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-linecap="round" />

  <path d="M 66 42 L 61 55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 66 42 L 71 55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <path d="M 26 55 Q 34 61 42 55 Z" fill="#FFFFFF" />

  <!-- Right Scale Pan -->
  <path d="M 58 55 Q 66 61 74 55 Z" fill="#FFFFFF" />

  <!-- Center Fulcrum Joint -->
  <circle cx="50" cy="42" r="3.5" fill="#FFFFFF" />
  <!-- Base Stand Node -->
  <circle cx="50" cy="73" r="3" fill="#FFFFFF" />

  <!-- AI Apex Diamond Spark (Intelligence & Grounding) -->
  <path d="M 50 14 L 52.5 19 L 57.5 21.5 L 52.5 24 L 50 29 L 47.5 24 L 42.5 21.5 L 47.5 19 Z" fill="url(#lexSpark)" />
</svg>
