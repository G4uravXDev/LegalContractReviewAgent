<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="favBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#favBg)" />

  <!-- Shield Shape Outline -->
  <path d="M 16 6 C 11 6, 7 8.5, 7 14 C 7 21, 14 26, 16 27 C 18 26, 25 21, 25 14 C 25 8.5, 21 6, 16 6 Z" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="rgba(255,255,255,0.06)" />

  <!-- Balance Beam -->
  <path d="M 8.5 13.5 H 23.5" stroke="url(#favBeam)" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Stem -->
  <path d="M 16 8.5 V 23.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

  <!-- Scale Left / Right Pans -->
  <path d="M 8 18 Q 11 20 14 18 Z" fill="#FFFFFF" />
  <path d="M 18 18 Q 21 20 24 18 Z" fill="#FFFFFF" />

  <!-- Apex Spark -->
  <circle cx="16" cy="7.5" r="1.5" fill="#34D399" />
  <circle cx="16" cy="13.5" r="1.5" fill="#FFFFFF" />
</svg>
